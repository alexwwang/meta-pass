name = "meta-pass"
compatibility_date = "2024-01-01"

# Cloudflare Pages 配置:
# install-slot/ 是静态资源目录, _worker.js 在里面处理 /api/* 反向代理
# 部署后地址: https://metapass.chuanxilu.net
pages_build_output_dir = "./install-slot"

# 本地部署: wrangler pages deploy
# CI 部署: 见 .github/workflows/workers.yml
#
# 如需自定义域名(如 install.example.com),在 Cloudflare Dashboard →
# Pages → meta-pass → Custom domains 中添加。

# r10.17: 解包产物持久化(按需物化) —— 用到的玩法才写 R2;
# 键 = extracted/<id>/<storeFwSha256>.bin + 同键 .meta.json 存映射
# (extractedSha256 ↔ 玩法原始固件 sha256/revisionId)。命中即直出,不一致即重写。
[[r2_buckets]]
bucket_name = "meta-pass-extracted"
binding = "meta_pass_extracted"

# 采集数据上行(pass-radar 校正采集,方案 A):手机页从设备拉 capture DATA
# 记录原始字节(RCB1)经本 Worker 校验后写入;键 = capture/<cardid>/<batch>.bin
# + 同名 .meta.json(cardid/batch/条数/字节/sha256/入桶时间)。cardid 由操作员
# 手填(固件契约:cardid 永不可经安装 API 读取)。
# 注意:本文件对 Pages 部署是文档性配置 —— 部署走 tools/pages-deploy.py(REST
# 上传),绑定实际管理在 Pages 项目设置(2026-10-22 经 REST PATCH 挂载
# meta_pass_capture);改此处不会自动应用/触发部署(workers.yml 触发路径不含
# 本文件)。
[[r2_buckets]]
bucket_name = "meta-pass-capture"
binding = "meta_pass_capture"

# r10.20-H1: 限速计数(每 IP+id 每分钟窗口)。审计发现仅声明未绑定 → 生产
# 限速从未生效(rateLimit 静默放行)。绑定后 429 由 r2check 的 rateLimited 诊断验证。
# 2026-11-18: 限速计数已迁入 RateLimiter Durable Object(RATE_LIMITER 绑定,
# 见下);analyze 摘要缓存(asum:)同日二步迁入同一 DO(kvget/kvset,create-only)。
# 本 namespace 现为最终回退:DO 与 ANALYZE_KV 都未绑时才落此处(本地 dev)。
[[kv_namespaces]]
binding = "RATE_KV"
id = "fbbc09c5cd724eecae12ca5ba7c0e75e"

# 2026-11-18: 限速计数 Durable Object 绑定(已挂载 production)。背景:KV put
# 每请求计费,Free plan 日限额 1000 write,生产基线 ~530/day(53%,Dashboard
# 告警);且写耗尽后 put 抛异常会让 /api/extracted 500。Pages 不支持 migrations,
# DO class 由独立 Worker ratelimit-do/ 上传(new_sqlite_classes,worker.js 头注释
# 含部署步骤)。REST 实测的挂载方式(PATCH pages/projects/meta-pass,
# deployment_configs.production):字段是 durable_object_namespaces(不是
# wrangler 语法的 durable_object_bindings),值 = DO namespace_id(本账号
# sqlite 命名空间由部署自动创建,GET workers/durable_objects/namespaces 可查):
#   {"RATE_LIMITER": {"namespace_id": "9dd1bca84ace4c61b83e398bb11ade1b"}}
# 与 RATE_KV/CAPKEY_KV 一样,本文件对 Pages 部署是文档性配置。注意:Pages
# 的 wrangler.toml schema 不接受 [[durable_object_bindings]] 表(wrangler
# 4.80 告警实测),故此处只留注释,真实绑定以上方 REST payload 为准(已挂载)。
# 写入契约由 tests/worker_contract.mjs PASS 14 钉住。

# capture 身份签名(2026-10-23 契约 v1):Ed25519 设备公钥注册表。
# 键 = capkey:<device_hash hex64>(first-wins,已存在 → 409);值 = pubkey hex64。
# ingest 端点对已注册设备执行 v7 trailer 验签;未注册 → verified:false 接受。
# 注:与 RATE_KV 一样,实际绑定经 Pages 项目设置管理(2026-10-23 REST PATCH
# 挂载 production);本文件为文档性配置。
[[kv_namespaces]]
binding = "CAPKEY_KV"
id = "9db1e47e5aa2477793c77a065e44785a"
