name = "meta-pass"
main = "worker/index.mjs"
compatibility_date = "2024-01-01"

# 静态文件:install-slot/ 下的页面 + vendor JS
# 访问 / 会得到 install-slot.html, /vendor/* 会得到对应 JS 文件
[assets]
directory = "./install-slot"
binding = "ASSETS"

# 部署后地址: https://meta-pass.<你的Cloudflare子域名>.workers.dev
#
# 注意:workers.dev 的 URL 格式为 <worker名>.<账号子域名>.workers.dev,
# 例如 https://meta-pass.springleeks.workers.dev
#
# 如需自定义域名(如 install.example.com),在 Cloudflare Dashboard →
# Workers → meta-pass → Settings → Triggers → Custom Domains 中添加。
