name = "meta-pass"
compatibility_date = "2024-01-01"

# Cloudflare Pages 配置:
# install-slot/ 是静态资源目录, _worker.js 在里面处理 /api/* 反向代理
# 部署后地址: https://meta-pass.pages.dev
pages_build_output_dir = "./install-slot"

# 本地部署: wrangler pages deploy
# CI 部署: 见 .github/workflows/workers.yml
#
# 如需自定义域名(如 install.example.com),在 Cloudflare Dashboard →
# Pages → meta-pass → Custom domains 中添加。

# r10.17: 解包产物持久化(按需物化) —— 用到的玩法才写 R2;
# 键 = extracted/<id>/<storeFwSha256>.bin + 同键 .meta.json 存映射
# (extractedSha256 ↔ 玩法原始固件 sha256/revisionId)。命中即直出,不一致即重写。
[[r2_buckets]]
bucket_name = "meta-pass-extracted"
binding = "meta_pass_extracted"

# r10.20-H1: 限速计数(每 IP+id 每分钟窗口)。审计发现仅声明未绑定 → 生产
# 限速从未生效(rateLimit 静默放行)。绑定后 429 由 r2check 的 rateLimited 诊断验证。
[[kv_namespaces]]
binding = "RATE_KV"
id = "fbbc09c5cd724eecae12ca5ba7c0e75e"
