name = "metapass-install-proxy"
main = "install-slot/proxy.mjs"
compatibility_date = "2024-01-01"

# ── 部署配置 ───────────────────────────────────────────────────────────
#
# 方案 A（推荐）：使用 Cloudflare 默认 workers.dev 子域名
#   部署后 Worker 地址: https://metapass-install-proxy.<user>.workers.dev
#   页面 fetch() 路径不变，无需改 install-slot.html
#
# 方案 B：绑定自定义域名（需先在 Cloudflare Dashboard 添加 DNS 记录）
#   [[routes]]
#   pattern = "install-api.your-domain.com/*"
#   zone_name = "your-domain.com"
#
# 方案 C：使用 Durable Objects（当前不需要）
#
# 部署方式：
#   1. 仓库 Settings → Secrets and variables → Actions → New repository secret
#      - CF_API_TOKEN:   <你的 Cloudflare API Token（Workers 写入权限）>
#      - CF_ACCOUNT_ID:  <你的 Cloudflare Account ID>
#   2. 推 main 分支时自动部署；或手动触发
#      gh run create --ref main --workflow=.github/workflows/workers.yml
#   3. 查看 Worker 地址：
#      wrangler deploy --dry-run
#      或 GitHub Actions 日志里的 deployment URL
