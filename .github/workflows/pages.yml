name: Deploy install-slot to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "install-slot/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@56afc609cb1f7f3c6f08a9d1c9f7e4a7b8c6d5e4
        with:
          path: install-slot
      - id: deployment
        uses: actions/deploy-pages@d6db9016455ae43e6a993c5a79072ee036e4e0c1
