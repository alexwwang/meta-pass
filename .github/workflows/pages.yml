name: Deploy install-slot to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "install-slot/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5fb1bf40adad2c779d0dc2e1d490e33a0
      - uses: actions/configure-pages@45bfe01926388064f86042efc6c13e2d0b6a9d26
      - uses: actions/upload-pages-artifact@98ef48e4b6b04a0480df1d861b040059c1b83ba9
        with:
          path: install-slot
      - id: deployment
        uses: actions/deploy-pages@368f8252ae9e3e37a5c950f5b4e0b7c4b98e6f1d
