name: Passport simulator

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "plays/**"
      - "skills/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: ESP32-C3 passport-sim boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Build verified merged firmware
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          command: ./tools/validate.sh --firmware

      - name: Checkout passport-sim
        run: |
          git clone --depth 1 https://github.com/VOID001/FoloToy-Passport-Simulator.git ../passport-sim
          cd ../passport-sim
          npm run prepare:emulator

      - name: Run passport-sim firmware test
        run: |
          node --version
          PASSPORT_SIM_DIR="$GITHUB_WORKSPACE/../passport-sim" ./tools/validate.sh --sim
