name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "install-slot/**"
      - "tools/pages-deploy.py"
      - ".github/workflows/workers.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      # 与本地同一部署路径:tools/pages-deploy.py 直接调 Cloudflare REST API
      # (staging 打版本戳 + blake3 manifest + upsert-hashes + worker bun bundle)。
      # 弃用 wrangler-action:wrangler 4.x pages deploy 在上传后读取响应时挂起
      # (本机实测,4.145.0),REST 路径为唯一验证可用的部署方式。
      # ubuntu-latest 镜像已预装 bun(worker bundle 需要)。
      - name: Install deploy deps
        run: pip3 install requests blake3
      - name: Deploy to Cloudflare Pages
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 tools/pages-deploy.py
