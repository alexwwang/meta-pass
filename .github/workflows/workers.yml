name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "install-slot/**"
      - "wrangler.toml"
      - ".github/workflows/workers.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      # 网页版本管理:同 pages.yml,把 __PAGE_VERSION__ 替换为 git 短 SHA
      - name: Stamp page version from git
        run: |
          V="$(git rev-parse --short HEAD)"
          sed -i "s/__PAGE_VERSION__/${V}/g" install-slot/install-slot.html
          echo "page version: ${V}"
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy --project-name meta-pass --branch main
