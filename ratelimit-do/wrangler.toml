name = "meta-pass-ratelimit-do"
main = "worker.js"
compatibility_date = "2024-04-03"

# 唯一职责:上传 RateLimiter Durable Object class,供 Pages 项目经
# durable_object_bindings 绑定(见 worker.js 头注释与 meta-pass/wrangler.toml)。
# 本服务不对外提供任何路由。

[[migrations]]
tag = "v2"
# 重建干净对象(2026-11-19:旧 RateLimiter 对象在当日多次 redeploy 后
# 状态不可见——写返回 written:true 但跨请求丢失/读悬挂;重命名即新对象新存储)。
renamed_classes = [{ from = "RateLimiter", to = "RateLimiter2" }]
